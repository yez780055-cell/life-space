name: Foundation checks and Android test APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: Write APK provenance
        run: |
          printf 'Commit: %s\nPackage: com.lifespace.foundation.test\nVersion: 0.1.0-test.1 (1)\nBuild: debug\n' "$(git rev-parse HEAD)" > android/app/build/outputs/apk/debug/BUILD-INFO.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk >> android/app/build/outputs/apk/debug/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: life-space-foundation-test-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
