name: Foundation Web checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Start built preview server
        env:
          LIFE_SPACE_PREVIEW_URL: http://127.0.0.1:4173/life-space/
          LIFE_SPACE_PREVIEW_ROOT: ${{ runner.temp }}/life-space-preview
        run: |
          mkdir -p "$LIFE_SPACE_PREVIEW_ROOT/life-space"
          cp -a dist/. "$LIFE_SPACE_PREVIEW_ROOT/life-space/"
          npm run preview -- --host 127.0.0.1 --outDir "$LIFE_SPACE_PREVIEW_ROOT" > /tmp/life-space-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS "$LIFE_SPACE_PREVIEW_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/life-space-preview.log
          exit 1
      - name: Verify desktop and mobile browser flows
        run: npm run verify:browser
        env:
          LIFE_SPACE_PREVIEW_URL: http://127.0.0.1:4173/life-space/
